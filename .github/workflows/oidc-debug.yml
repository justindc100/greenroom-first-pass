name: OIDC claims (debug)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Print the decoded OIDC claims (payload only, never the signature)
        run: |
          set -euo pipefail
          token=$(curl -sf -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=greenroom" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).value))')
          node -e 'const t=process.argv[1].split(".")[1];const p=JSON.parse(Buffer.from(t.replace(/-/g,"+").replace(/_/g,"/"),"base64").toString());for (const k of ["sub","repository","repository_id","ref","sha","event_name","job_workflow_ref","job_workflow_sha","workflow_ref","head_ref","base_ref","actor_id","run_id","run_attempt","aud"]) console.log(k+"="+JSON.stringify(p[k]));' "$token"
