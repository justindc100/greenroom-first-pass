name: Greenroom
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  greenroom:
    permissions:
      contents: read
      id-token: write
    uses: justindc100/greenroom-action/.github/workflows/pass.yml@9004c8b09ee745c6a37fcfe74480fec0d47fe11c
    with:
      platform: web
      app-id: first-pass
      prepare: |
        npm install --no-save --no-audit --no-fund serve@14 > serve-install.log 2>&1
        nohup npx --no-install serve -l 4173 -s . > serve.log 2>&1 &
        for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
        curl -sf http://127.0.0.1:4173/ >/dev/null || { echo "preview never answered on 4173"; cat serve-install.log serve.log; exit 1; }
      target-url: http://127.0.0.1:4173/
      artifact-path: .
      source-upload-allowed: "true"
      goal: Start a session from Today, complete every step, rate it, and confirm it appears in Progress history.
