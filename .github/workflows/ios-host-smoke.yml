# No-model hosted iOS smoke for the disposable fixture repository
# (justindc100/greenroom-first-pass): measures how often and how long the
# macos-26 simulator's display-capture and accessibility paths stall, on the
# 0.3.13 preparation path (no warm-up), with scripts/ios-host-smoke.mjs. It
# calls no model, mints no Greenroom run, exchanges nothing with the control
# plane and costs nothing beyond public-repository Actions minutes. The public
# runner repository is fetched at a pinned commit only for the agent-device
# CLI it vendors; nothing here trusts, publishes or pins a runner. Copy this
# file with the fixture source and scripts into the fixture repository (see
# docs/release-canaries.md for the packet conventions) on its own branch.
# GitHub resolves workflow_dispatch against the default branch only, so on a
# disposable branch the dispatch is a push to that branch (an empty commit
# will do; the inputs then take their defaults). Nothing else triggers it.
name: Greenroom iOS host smoke
on:
  push:
    branches: ["codex/ios-host-smoke*"]
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds of snapshot / simctl screenshot / tab tap / agent-device screenshot
        required: false
        default: "10"
      runner-sha:
        description: justindc100/greenroom-action commit whose vendored agent-device CLI drives the simulator (the untrusted 0.3.17 smoke publication 1773abf8 from greenroom@3ea14f4 by default; read for its bundle and CLI only, never trusted or pinned)
        required: false
        default: 1773abf88ac82107a7a4a89f6e33d5449c6216a2
      label:
        description: Free-text label recorded in the report
        required: false
        default: ""
      driver:
        description: raw (agent-device CLI calls, the 2026-09-09 baseline) or harness (the runner bundle's own iOS adapter, `ios-smoke`, with its settle gate and RUNNER_BUSY recovery)
        required: false
        default: harness
      spotlight:
        description: off (sudo mdutil -a -i off before the simulator boots) or on (leave the image's indexer running)
        required: false
        default: "off"
permissions:
  contents: read
concurrency:
  group: greenroom-ios-host-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      # The workflow_dispatch defaults, repeated for the push trigger, where
      # the inputs context is empty; a fetch of the runner repository must
      # never fall back to its mutable main.
      SMOKE_ROUNDS: ${{ inputs.rounds || '10' }}
      SMOKE_RUNNER_SHA: ${{ inputs.runner-sha || '1773abf88ac82107a7a4a89f6e33d5449c6216a2' }}
      SMOKE_LABEL: ${{ inputs.label || github.event.head_commit.message || '' }}
      SMOKE_DRIVER: ${{ inputs.driver || 'harness' }}
      SMOKE_SPOTLIGHT: ${{ inputs.spotlight || 'off' }}
      SMOKE_CLI: .greenroom-action/dist/node_modules/agent-device/bin/agent-device.mjs
      SMOKE_BUNDLE: .greenroom-action/dist/index.js
    steps:
      - name: Check out the fixture
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      - name: Fetch the runner repository for its vendored agent-device CLI
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          repository: justindc100/greenroom-action
          ref: ${{ inputs.runner-sha || '1773abf88ac82107a7a4a89f6e33d5449c6216a2' }}
          path: .greenroom-action
          persist-credentials: false

      - name: Verify the fetched revision and record host facts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SMOKE_RUNNER_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C .greenroom-action rev-parse HEAD)" = "$SMOKE_RUNNER_SHA"
          test -f "$SMOKE_CLI"
          {
            echo "### Host"
            echo '```'
            sw_vers
            xcodebuild -version
            echo "node $(node --version)"
            echo "agent-device $(node "$SMOKE_CLI" --version)"
            echo "hw.ncpu $(sysctl -n hw.ncpu)  hw.memsize $(sysctl -n hw.memsize)  hw.model $(sysctl -n hw.model)"
            echo "runner ${RUNNER_NAME:-?}  image ${ImageOS:-?} ${ImageVersion:-?}"
            xcrun simctl list runtimes | grep -i ios || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          command -v xcodegen >/dev/null || brew install xcodegen

      # Spotlight indexing off before the simulator boots, the same step the
      # pass workflow (pass.yml) runs on GitHub-hosted Macs: the three raw
      # smokes of 2026-09-09 (34408902477, 34410772878, 34412523322) found the
      # image's indexer (`mds`, `mds_stores`, four to six `mdworker_shared`
      # at 9-29 % each) saturating the 3-vCPU host as the job started, load
      # 85 to 212, and every run's first capture after open 6 to 15 s slow.
      # A failure is a warning; the smoke still measures.
      - name: Turn Spotlight indexing off on the hosted Mac
        if: env.SMOKE_SPOTLIGHT == 'off'
        shell: bash
        run: |
          set +e
          if sudo mdutil -a -i off; then echo "Spotlight indexing off on every volume."; else echo "::warning::sudo mdutil -a -i off failed (exit $?); the host keeps indexing"; fi
          sudo mdutil -a -s 2>/dev/null | head -20
          { echo "### Spotlight"; echo '```'; sudo mdutil -a -s 2>/dev/null | head -20; pgrep -fl 'mds|mdworker' | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Build, fresh simulator, install and XCTest preparation come from
      # scripts/prepare-ios-canary.mjs inside the smoke script; then the rounds,
      # through the bundle's own iOS adapter (`ios-smoke`, driver harness) or
      # raw agent-device calls (driver raw). A slow host does not fail this
      # step; a tool error does, and so does an adapter recovery that fails
      # closed (an operation that stays failed after the poll and re-attach).
      - name: Run the host smoke
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-host-smoke"
          node scripts/ios-host-smoke.mjs ios --runner-cli "$SMOKE_CLI" --driver "$SMOKE_DRIVER" --runner-bundle "$SMOKE_BUNDLE" --rounds "$SMOKE_ROUNDS" --label "$SMOKE_LABEL" --report "$RUNNER_TEMP/ios-host-smoke/report.json"

      # The same process inventory the pass's orphan sweep prints: an
      # xcodebuild still alive here is the runner retained for its idle stop.
      - name: Sweep processes and the simulator
        if: always()
        shell: bash
        run: |
          set +e
          echo "### Sweep" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; pgrep -fl 'xcodebuild|agent-device|DTServiceHub|node' | grep -v Runner.Listener; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          node "$SMOKE_CLI" daemon stop --clean || true
          pkill -x xcodebuild || true
          udid=$(node -e 'try{console.log(require(process.argv[1]).udid)}catch{}' "$PWD/ios/build/simulator.json")
          if [ -n "$udid" ]; then xcrun simctl shutdown "$udid" || true; xcrun simctl delete "$udid" || true; fi
          cp ios/build/simulator.json "$RUNNER_TEMP/ios-host-smoke/" 2>/dev/null || true
          exit 0

      # Always: the report is the point of the run, and agent-device's own logs
      # (runner.log, per-request logs, event stream, daemon log) hold the
      # watchdog / RUNNER_BUSY / BUILD INTERRUPTED lines the report counts.
      # They contain session names, the UDID and xcodebuild output; no secrets.
      - name: Upload the smoke report and agent-device session logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7, Node 24
        with:
          name: greenroom-ios-host-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ios-host-smoke/
            ~/.agent-device/sessions/sim-*/runner.log
            ~/.agent-device/sessions/sim-*/requests/
            ~/.agent-device/sessions/sim-*/events.ndjson
            ~/.agent-device/daemon.log
          if-no-files-found: warn
          retention-days: 30
